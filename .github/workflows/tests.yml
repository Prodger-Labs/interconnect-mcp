name: tests

# The repo had no test check at all, so a dependency bump could merge and break
# the server with nothing to catch it. express is the concrete case: it was
# imported but never declared, and resolved only as a transitive of
# @modelcontextprotocol/sdk, which now ships hono alongside it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # @v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: node --check server.js
      - run: npm test
