name: tests

# The repo had no test check at all, so a dependency bump could merge and break
# the server with nothing to catch it. express is the concrete case: it was
# imported but never declared, and resolved only as a transitive of
# @modelcontextprotocol/sdk, which now ships hono alongside it.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    # Moved off ubuntu-latest to cut billed Actions minutes: this repo is
    # private, so every hosted minute is charged. Safe here because private
    # repos take no outside fork PRs, which is the usual reason not to put
    # pull_request work on your own hardware.
    #
    # The trade is availability: while this job is self-hosted, nothing
    # merges when the runners are down, because it gates the merge like
    # every other check. timeout-minutes bounds a wedged run; it does not
    # bound queue time, which GitHub gives up on after 24h.
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # @v7.0.0
        with:
          node-version: "24"
      - run: npm ci
      - run: node --check server.js
      - run: npm test
