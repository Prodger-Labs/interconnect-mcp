name: Lint

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  lint:
    # Moved off ubuntu-latest to cut billed Actions minutes: this repo is
    # private, so every hosted minute is charged. Safe here because private
    # repos take no outside fork PRs, which is the usual reason not to put
    # pull_request work on your own hardware.
    #
    # The trade is availability: while this job is self-hosted, nothing
    # merges when the runners are down, because it gates the merge like
    # every other check. timeout-minutes bounds a wedged run; it does not
    # bound queue time, which GitHub gives up on after 24h.
    runs-on: [self-hosted, linux]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1

      - name: YAML lint
        uses: ibiqlik/action-yamllint@2576378a8e339169678f9939646ee3ee325e845c # @v3
        with:
          file_or_dir: .
          config_data: |
            extends: default
            rules:
              line-length:
                max: 200
                level: warning
              document-start: disable
              truthy:
                check-keys: false
              comments:
                min-spaces-from-content: 1
              indentation:
                spaces: 2
                indent-sequences: consistent
              braces:
                max-spaces-inside: 1
              brackets:
                max-spaces-inside: 1

      # The repo currently has no Python at all, so installing an interpreter
      # and pip installing ruff on every run bought nothing. It costs real
      # time on a self-hosted arm64 box in particular, where pip often builds
      # wheels from source rather than fetching them.
      #
      # Detected rather than deleted, so Python linting comes back by itself
      # the moment a .py file appears, instead of being silently absent.
      - name: Detect Python sources
        id: python_sources
        run: |
          set -euo pipefail
          if find . -name '*.py' -not -path './.git/*' -not -path './.venv/*' \
                    -not -path '*/node_modules/*' -print -quit | grep -q .; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No Python sources found; skipping the ruff lint."
          fi

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # @v7.0.0
        if: steps.python_sources.outputs.found == 'true'
        with:
          python-version: '3.12'

      - name: Python lint (ruff)
        if: steps.python_sources.outputs.found == 'true'
        run: |
          pip install ruff
          ruff check . \
            --select E,F \
            --ignore E501,E402,E701,E741,F841 \
            --exclude ".venv,node_modules,__pycache__,.git"

      # Pinned binary rather than apt, for the same reasons as gitleaks in
      # secret-scan.yml: apt-get needs sudo, which a self-hosted runner may
      # not grant, and it pulls whatever version the distro happens to carry,
      # so the same source can lint clean on one runner and fail on another.
      # Version and checksum pinned per architecture; an unrecognised machine
      # fails loudly rather than silently skipping the lint.
      - name: Shell lint (shellcheck)
        env:
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256_X86_64: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
          SHELLCHECK_SHA256_AARCH64: 12b331c1d2db6b9eb13cfca64306b1b157a86eb69db83023e261eaa7e7c14588
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64)        arch=x86_64;  sha="${SHELLCHECK_SHA256_X86_64}" ;;
            aarch64|arm64) arch=aarch64; sha="${SHELLCHECK_SHA256_AARCH64}" ;;
            *) echo "::error::No pinned shellcheck build for $(uname -m)"; exit 1 ;;
          esac
          tarball="shellcheck-v${SHELLCHECK_VERSION}.linux.${arch}.tar.xz"
          curl -sSfL -o "${tarball}" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${tarball}"
          echo "${sha}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xJf "${tarball}" --strip-components=1 \
            -C "${RUNNER_TEMP}/bin" "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          chmod 0755 "${RUNNER_TEMP}/bin/shellcheck"
          "${RUNNER_TEMP}/bin/shellcheck" --version
          find . -name "*.sh" \
               -not -path "./.git/*" \
               -not -path "./.venv/*" \
               -not -path "*/node_modules/*" \
               -print0 \
          | xargs -0 --no-run-if-empty "${RUNNER_TEMP}/bin/shellcheck"
