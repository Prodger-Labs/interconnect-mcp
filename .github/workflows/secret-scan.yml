name: Secret scan

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    # Which runner this lands on is a repository variable, not a hardcoded
    # label, and it defaults to ubuntu-latest.
    #
    # Hardcoding self-hosted made the workflow depend on hardware being up
    # with no way back: when the runners did not claim the job it sat queued
    # rather than failing, for the 24h GitHub waits before giving up, and
    # since this check gates the merge nothing could land in the meantime —
    # including a fix for the runners. A switch that defaults to the hosted
    # runner cannot wedge the repo that way.
    #
    # To move this onto your own hardware, set the CI_RUNNER repository
    # variable to self-hosted (Settings -> Secrets and variables -> Actions
    # -> Variables). To move it back, clear the variable. Neither needs a
    # commit, so recovering from a dead runner is a settings change rather
    # than a PR that cannot merge because the runner is dead.
    #
    # Safe to point at your own hardware only while this repo is private:
    # self-hosted runners on pull_request workflows otherwise let a fork PR
    # run its own code on your machine, and this job has no same-repo guard.
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1
        with:
          fetch-depth: 0

      # gitleaks-action refuses to run under an organisation account without a
      # licence key, and this repo moved to Prodger-Labs. It was failing every
      # PR with "missing gitleaks license", which meant no secret scanning was
      # happening at all while the red X looked like an ordinary test failure.
      #
      # The gitleaks binary itself is MIT and free, so run it directly. Pinned
      # by version and verified by sha256 so a compromised release cannot slip
      # through.
      # Architecture is selected at runtime rather than hardcoded. The x64
      # tarball was fetched unconditionally, which on an arm64 runner is a
      # quiet trap: the checksum still verifies, because it really is the
      # correct x64 file, and the failure surfaces afterwards as an exec
      # format error with nothing in the log tying it to architecture.
      # An unrecognised machine fails loudly instead of guessing.
      #
      # Installed under RUNNER_TEMP rather than sudo install into
      # /usr/local/bin. Passwordless sudo is a given on GitHub-hosted runners
      # and often absent on a self-hosted box, and a secret scanner is the
      # last job that should need root to set itself up.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
          GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            # gitleaks names its assets x64/arm64; shellcheck in lint.yml
            # names the same machines x86_64/aarch64. Both spellings of the
            # uname are accepted here; the asset name is each project's own.
            x86_64)        arch=x64;   sha="${GITLEAKS_SHA256_X64}" ;;
            aarch64|arm64) arch=arm64; sha="${GITLEAKS_SHA256_ARM64}" ;;
            *) echo "::error::No pinned gitleaks build for $(uname -m)"; exit 1 ;;
          esac
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          curl -sSfL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${sha}  ${tarball}" | sha256sum -c -
          mkdir -p "${RUNNER_TEMP}/bin"
          tar -xzf "${tarball}" -C "${RUNNER_TEMP}/bin" gitleaks
          chmod 0755 "${RUNNER_TEMP}/bin/gitleaks"
          # Deliberately not added to PATH. This workflow previously did
          # `sudo install` into /usr/local/bin, so a self-hosted runner that
          # ran the old version still has a gitleaks there — possibly a
          # different version, possibly the wrong architecture. Persistent
          # state is the whole difference between a hosted runner and yours.
          # The scan below names the binary by absolute path so which one runs
          # never depends on PATH resolution.
          # Runs the binary that was just installed, so a wrong-architecture
          # download fails here with a clear message rather than mid-scan.
          "${RUNNER_TEMP}/bin/gitleaks" version

      # Scans the full history, not just the diff, so a secret committed and
      # then removed in a later commit is still caught. Known false positives
      # are pinned by fingerprint in .gitleaksignore. --redact keeps any match
      # out of the build log.
      - name: Scan for secrets
        run: |
          "${RUNNER_TEMP}/bin/gitleaks" git . --no-banner --redact --verbose
