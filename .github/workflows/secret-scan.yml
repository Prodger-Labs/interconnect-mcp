name: Secret scan

on:
  pull_request:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # @v7.0.1
        with:
          fetch-depth: 0

      # gitleaks-action refuses to run under an organisation account without a
      # licence key, and this repo moved to Prodger-Labs. It was failing every
      # PR with "missing gitleaks license", which meant no secret scanning was
      # happening at all while the red X looked like an ordinary test failure.
      #
      # The gitleaks binary itself is MIT and free, so run it directly. Pinned
      # by version and verified by sha256 so a compromised release cannot slip
      # through.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "${tarball}" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${tarball}"
          echo "${GITLEAKS_SHA256}  ${tarball}" | sha256sum -c -
          tar -xzf "${tarball}" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Scans the full history, not just the diff, so a secret committed and
      # then removed in a later commit is still caught. Known false positives
      # are pinned by fingerprint in .gitleaksignore. --redact keeps any match
      # out of the build log.
      - name: Scan for secrets
        run: gitleaks git . --no-banner --redact --verbose
